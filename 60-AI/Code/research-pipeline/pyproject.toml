[project]
name = "research-pipeline"
version = "0.1.0"
description = "Evidence-based research pipeline — separates retrieval (Python) from reasoning (Hermes)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "markdownify>=0.14",
]

[project.scripts]
research-pipeline = "research_pipeline.cli:main"

[tool.uv]
package = true
